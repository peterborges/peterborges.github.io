  <meta charset="UTF-8" />

</head>
<body>
  <!-- Custom cursor for case studies -->
  <div class="cursor-follower" id="cursorFollower">
    <div class="cursor-follower-inner">
      <span>View case study</span>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M12 5l7 7-7 7"/><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
  </div>

  <!-- Custom cursor for resume -->
  <div class="cursor-follower" id="resumeCursorFollower">
    <div class="cursor-follower-inner">
      <span>View resume</span>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
  </div>

  <div class="content-container">
    <header class="intro-section">
      <div class="grid-pattern" id="gridPattern"></div>
      <div class="intro-text">
        <div class="greeting-row">
          <img src="images/index/borges-headshot.jpeg" alt="Peter Borges" class="headshot" />
          <p class="greeting">Hi, I'm Peter <span class="wave-emoji">👋</span></p>
        </div>
        <h1 class="site-title">Product designer turning complex systems into interfaces people love.</h1>
        <p class="intro">Ten years making robots, banks, and governments feel human.</p>
        <p class="intro locations">Based in <span class="city-wrapper"><span class="city struck">Providence</span><img src="images/index/providence.png" alt="Providence" class="city-popover" loading="lazy" /></span>, <span class="city-wrapper"><span class="city struck">San Francisco</span><img src="images/index/san-francisco.png" alt="San Francisco" class="city-popover" loading="lazy" /></span>, <span class="city-wrapper"><span class="city">Brooklyn</span><img src="images/index/brooklyn.png" alt="Brooklyn" class="city-popover" loading="lazy" /></span>.</p>
        <div class="intro-links">
          <a href="https://drive.google.com/file/d/1JjAlBwxkYLUfPeR6OmHYoYwNVmCS7Ir5/view?usp=sharing" target="_blank" class="intro-link">Resume <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></a>
          <a href="https://www.linkedin.com/in/peterborges/" target="_blank" class="intro-link">LinkedIn <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></a>
        </div>
      </div>
    </header>

    <section id="work">
      <h2 class="section-label">Selected Work</h2>
      <div class="projects" id="projectContainer"></div>
    </section>
  </div>

  <!-- Dynamic Footer -->
  <div id="site-footer"></div>

  <script>
    // Custom cursor follower
    (function() {
      const cursor = document.getElementById('cursorFollower');
      const resumeCursor = document.getElementById('resumeCursorFollower');
      let mouseX = 0, mouseY = 0;
      let cursorX = 0, cursorY = 0;

      // Smooth cursor movement
      function animateCursor() {
        const ease = 0.15;
        cursorX += (mouseX - cursorX) * ease;
        cursorY += (mouseY - cursorY) * ease;
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
        resumeCursor.style.left = cursorX + 'px';
        resumeCursor.style.top = cursorY + 'px';
        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      // Track mouse position
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      // Show/hide on project cards (using event delegation)
      document.addEventListener('mouseover', (e) => {
        const card = e.target.closest('.project-card:not(.resume-card)');
        const resumeCard = e.target.closest('.resume-card');
        if (card) {
          cursor.classList.add('active');
        }
        if (resumeCard) {
          resumeCursor.classList.add('active');
        }
      });

      document.addEventListener('mouseout', (e) => {
        const card = e.target.closest('.project-card:not(.resume-card)');
        const resumeCard = e.target.closest('.resume-card');
        if (card && !card.contains(e.relatedTarget)) {
          cursor.classList.remove('active');
        }
        if (resumeCard && !resumeCard.contains(e.relatedTarget)) {
          resumeCursor.classList.remove('active');
        }
      });

      // Hide cursors when leaving window
      document.addEventListener('mouseleave', () => {
        cursor.classList.remove('active');
        resumeCursor.classList.remove('active');
      });
    })();

    // Inline project data (no extra network request)
    (function() {
      const projects = [
        {
          title: "GovWell Plan Review",
          tags: "UX · UI · Prototyping · Claude Code · Launch",
          description: "Modernizing plan review permitting for local governments.",
          impact: "<strong>$9.5M</strong> seed funding · Launched to <strong>80+</strong> municipalities",
          image: "images/index/govwell-hero.png",
          video: "videos/govwell-plan-review/plan-review-comments.mp4",
          link: "govwell-plan-review.html"
        },
        {
          title: "VIAM Machine Configuration",
          tags: "Strategy · Research · UX · UI · IA · Prototyping · Launch",
          description: "AI/automation tooling for configuring smart machines.",
          impact: "<strong>$117M</strong> raised · <strong>2,750+</strong> devs · <strong>40+</strong> partnerships",
          image: "images/index/app-viam-mockup.png",
          link: "viam-machine-configuration.html"
        },
        {
          title: "VIAM TeleOp",
          tags: "Strategy · Research · UX · UI · IA · Prototyping · Launch",
          description: "Live sensor dashboard for remote machine operation.",
          impact: "<strong>$2.75M</strong> signed contracts · <strong>6</strong> business partnerships",
          image: "images/index/teleop-hero-3.png",
          link: "viam-teleop.html"
        }
      ];

      const container = document.getElementById('projectContainer');

      projects.forEach(function(project, index) {
        const card = document.createElement('a');
        card.href = project.link;
        card.className = 'project-card';
        // First card eager-load; rest lazy. Video cards use preload=metadata.
        const loadingAttr = index === 0 ? 'eager' : 'lazy';
        const decodingAttr = index === 0 ? 'sync' : 'async';

        const imageHtml = project.video
          ? ''
          : '<img class="project-thumb" src="' + project.image + '" alt="' + project.title + ' Thumbnail" loading="' + loadingAttr + '" decoding="' + decodingAttr + '" />';

        const videoHtml = project.video
          ? '<video class="project-thumb project-thumb-video' + (project.videoFit === 'contain' ? ' project-thumb-video--contain' : '') + '" src="' + project.video + '" muted playsinline loop preload="metadata"></video>'
          : '';

        card.innerHTML =
          '<div class="project-info"><h3>' + project.title + '</h3><div class="tags">' + project.tags + '</div><p>' + project.description + '</p><p class="project-impact">' + project.impact + '</p></div>' +
          '<div class="project-thumb-wrapper">' + imageHtml + videoHtml + '</div>';

        if (project.video) {
          const video = card.querySelector('.project-thumb-video');
          video.addEventListener('loadedmetadata', function() {
            video.currentTime = 0;
          });
          card.addEventListener('mouseenter', function() { video.play(); });
          card.addEventListener('mouseleave', function() {
            video.pause();
            video.currentTime = 0;
          });
        }
        container.appendChild(card);
      });

      // Count-up animation for impact metrics
      (function() {
        function parseMetric(text) {
          // Extracts prefix (e.g. "$"), number (e.g. 9.5), suffix (e.g. "M", "+")
          const match = text.match(/^([^0-9]*)(\d+(?:\.\d+)?)(.*)$/);
          if (!match) return null;
          return { prefix: match[1], value: parseFloat(match[2]), suffix: match[3] };
        }

        function animateCounter(el, metric, duration) {
          const start = performance.now();
          const isFloat = metric.value % 1 !== 0;
          function step(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            // Ease out cubic
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = eased * metric.value;
            el.textContent = metric.prefix + (isFloat ? current.toFixed(1) : Math.floor(current)) + metric.suffix;
            if (progress < 1) requestAnimationFrame(step);
            else el.textContent = metric.prefix + metric.value + metric.suffix;
          }
          requestAnimationFrame(step);
        }

        const observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (!entry.isIntersecting) return;
            const impactEl = entry.target;
            observer.unobserve(impactEl); // never re-animate
            impactEl.querySelectorAll('strong').forEach(function(strong) {
              const metric = parseMetric(strong.textContent.trim());
              if (!metric) return;
              animateCounter(strong, metric, 1200);
            });
          });
        }, { threshold: 0.4 });

        document.querySelectorAll('.project-impact').forEach(function(el) {
          observer.observe(el);
        });
      })();

      // About Me card
      const aboutCard = document.createElement('div');
      aboutCard.className = 'about-card';
      aboutCard.innerHTML = '<div class="about-content"><h3>About me</h3><p>I\'ve spent the last decade obsessing over the details that make complex systems actually usable. Currently at <strong>GovWell</strong>, turning bureaucratic nightmares into interfaces people don\'t dread.</p><p>When I\'m not in Figma, I\'m probably <a href="https://www.kissenacycling.com/" target="_blank">racing bikes</a> through Brooklyn.</p></div><div class="about-image"><img src="images/about/RevUnit-CoWorking.jpg" alt="Peter Borges at work" loading="lazy" decoding="async" /></div>';
      container.appendChild(aboutCard);

      // Resume card
      const resumeCard = document.createElement('a');
      resumeCard.href = 'https://drive.google.com/file/d/1JjAlBwxkYLUfPeR6OmHYoYwNVmCS7Ir5/view?usp=sharing';
      resumeCard.target = '_blank';
      resumeCard.className = 'project-card resume-card';
      resumeCard.innerHTML = '<div class="project-info"><h3>Resume</h3><div class="tags">Experience · Skills · Education</div><p>10+ years designing for robotics, fintech, and government.</p></div>';
      container.appendChild(resumeCard);
    })();

    // Generate grid pattern
    (function() {
      const gridContainer = document.getElementById('gridPattern');
      if (!gridContainer) return;

      const header = document.querySelector('.intro-section');
      const cols = Math.ceil((header.offsetWidth * 1.1) / 56) + 2;
      const rows = Math.ceil((header.offsetHeight + 112) / 56) + 2;
      const MAX_SQUARES = 150;
      const count = Math.min(cols * rows, MAX_SQUARES);

      const svgContent = '<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="48" height="48" rx="12" fill="none" stroke-width="1"/></svg>';
      let squares = [];
      for (let i = 0; i < count; i++) {
        const square = document.createElement('div');
        square.className = 'grid-square';
        square.innerHTML = svgContent;
        gridContainer.appendChild(square);
        squares.push(square);
      }

      // Random pulse animation
      let pulseInterval = null;
      function pulseRandomSquare() {
        const randomIndex = Math.floor(Math.random() * squares.length);
        const square = squares[randomIndex];
        if (!square.classList.contains('pulse')) {
          square.classList.add('pulse');
          setTimeout(() => square.classList.remove('pulse'), 2500);
        }
      }

      function startPulses() {
        if (pulseInterval) return;
        pulseInterval = setInterval(pulseRandomSquare, 400);
      }

      function stopPulses() {
        if (pulseInterval) {
          clearInterval(pulseInterval);
          pulseInterval = null;
        }
        // Release square references to allow GC
        squares = [];
      }

      // Start pulses, stop when header scrolls out of view
      startPulses();
      for (let i = 0; i < 3; i++) {
        setTimeout(pulseRandomSquare, i * 300);
      }

      const headerObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            startPulses();
          } else {
            stopPulses();
            headerObserver.disconnect();
          }
        });
      }, { threshold: 0 });
      headerObserver.observe(header);
    })();


    // Load footer from partial
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }

    // Initialize theme from saved preference or system preference
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme) {
        if (theme === 'system' || !theme) {
          // Follow system preference
          document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }

      // Apply initial theme
      applyTheme(savedTheme || 'system');

      // Listen for system theme changes
      prefersDark.addEventListener('change', (e) => {
        const currentSetting = localStorage.getItem('theme');
        if (!currentSetting || currentSetting === 'system') {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();

    includeHTML('#site-footer', 'partials/footer.html', function() {
      // Setup theme switcher
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher) {
        const buttons = themeSwitcher.querySelectorAll('.theme-option');
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        buttons.forEach(btn => {
          if (btn.dataset.theme === savedTheme) btn.classList.add('active');
        });

        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (theme === 'system') {
              document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
              localStorage.setItem('theme', 'system');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
              localStorage.setItem('theme', theme);
            }
          });
        });
      }
    });

  </script>
</body>

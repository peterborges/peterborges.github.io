<html lang="en">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* Loading Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .headshot {
      animation: fadeIn 0.5s ease-out 0.1s both;
    }
    .greeting {
      animation: fadeIn 0.5s ease-out 0.2s both;
    }

    .site-title {
      animation: fadeInUp 0.6s ease-out 0.3s both;
    }

    .intro-text .intro {
      animation: fadeInUp 0.5s ease-out 0.5s both;
    }

    .section-label {
      animation: fadeIn 0.5s ease-out 0.5s both;
    }

    .project-card {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out both;
    }

    .project-card:nth-child(1) { animation-delay: 0.6s; }
    .project-card:nth-child(2) { animation-delay: 0.7s; }
    .project-card:nth-child(3) { animation-delay: 0.8s; }
    .project-card:nth-child(4) { animation-delay: 0.9s; }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .greeting,
      .site-title,
      .intro-text .intro,
      .section-label,
      .project-card {
        animation: none;
        opacity: 1;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    footer {
      margin-top: auto;
    }
    .content-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .greeting-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0 0.75rem 0;
    }
    .headshot {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 1s ease;
      cursor: pointer;
    }
    .headshot:hover {
      transform: rotate(360deg);
    }
    .wave-emoji {
      display: inline-block;
      cursor: pointer;
      transform-origin: 70% 70%;
    }
    .wave-emoji:hover {
      animation: wave 2s ease-in-out 4;
    }
    @keyframes wave {
      0% { transform: rotate(0deg); }
      15% { transform: rotate(12deg); }
      30% { transform: rotate(-6deg); }
      45% { transform: rotate(12deg); }
      60% { transform: rotate(-2deg); }
      75% { transform: rotate(6deg); }
      100% { transform: rotate(0deg); }
    }
    .greeting {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
    }
    .site-title {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 700;
      margin: 0 0 1.25rem 0;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text-primary);
    }
    .intro {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0;
      max-width: 600px;
    }
    .intro-section {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
      position: relative;
      overflow: visible;
    }
    .intro-section .intro-text {
      position: relative;
      z-index: 1;
    }
    .grid-pattern-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      top: -56px;
      left: calc(-50vw + 50%);
      width: 100vw;
      height: calc(100% + 56px);
      display: grid;
      grid-template-columns: repeat(auto-fill, 56px);
      grid-template-rows: repeat(auto-fill, 56px);
      gap: 0;
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
    }
    .grid-square {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .grid-square svg {
      width: 52px;
      height: 52px;
      transition: all 1.2s ease-out;
    }
    .grid-square svg rect {
      stroke: rgba(0, 0, 0, 0.04);
      transition: stroke 1.2s ease-out, fill 1.2s ease-out;
    }
    .grid-square:hover svg {
      transition: all 0.15s ease-out;
    }
    .grid-square:hover svg rect {
      stroke: rgba(0, 0, 0, 0.12);
      fill: rgba(0, 0, 0, 0.02);
      transition: stroke 0.15s ease-out, fill 0.15s ease-out;
    }
    .grid-square.pulse svg rect {
      animation: squarePulse 2.5s ease-in-out;
    }
    @keyframes squarePulse {
      0%, 100% {
        stroke: rgba(0, 0, 0, 0.04);
        fill: transparent;
      }
      50% {
        stroke: rgba(0, 0, 0, 0.1);
        fill: rgba(0, 0, 0, 0.015);
      }
    }
    [data-theme="dark"] .grid-square svg rect {
      stroke: rgba(255, 255, 255, 0.08);
    }
    [data-theme="dark"] .grid-square:hover svg rect {
      stroke: rgba(255, 255, 255, 0.25);
      fill: rgba(255, 255, 255, 0.05);
    }
    [data-theme="dark"] .grid-square.pulse svg rect {
      animation: squarePulseDark 2.5s ease-in-out;
    }
    @keyframes squarePulseDark {
      0%, 100% {
        stroke: rgba(255, 255, 255, 0.08);
        fill: transparent;
      }
      50% {
        stroke: rgba(255, 255, 255, 0.2);
        fill: rgba(255, 255, 255, 0.04);
      }
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 3rem 0 1.5rem 0;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }
    .project-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      cursor: none;
    }

    /* Custom cursor for case studies */
    .cursor-follower {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .cursor-follower.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .cursor-follower-inner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--text-primary);
      color: var(--bg-primary);
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 100px;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .cursor-follower-inner svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    [data-theme="dark"] .cursor-follower-inner {
      background: #fff;
      color: #0a0a0a;
    }
    [data-theme="dark"] .project-card:hover {
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .project-card h3 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 0.35rem 0;
    }
    .project-card:hover h3 {
      text-decoration: underline;
    }
    .project-card .tags {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .project-info {
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.5rem;
    }
    .project-info p {
      margin: 0.5rem 0 0;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }
    .project-impact {
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }
    .project-impact strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .project-thumb-wrapper {
      padding: 0 3rem 0 3rem;
      overflow: visible;
    }
    .project-thumb {
      width: 100%;
      height: 520px;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      transition: transform 0.4s ease;
      transform: translateY(30px);
    }
    .project-card:hover .project-thumb {
      transform: translateY(10px);
    }

    /* About Me Card */
    .about-card {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      grid-template-rows: 1fr;
      gap: 0;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    .about-card > * {
      min-height: 0;
    }
    .about-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem;
    }
    .about-content h3 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1.25rem 0;
      color: var(--text-primary);
    }
    .about-content p {
      color: var(--text-secondary);
      line-height: 1.7;
      margin: 0 0 1rem 0;
      font-size: 1.05rem;
    }
    .about-content p:last-child {
      margin-bottom: 0;
    }
    .about-content a {
      color: var(--text-primary);
      text-decoration: underline;
    }
    .about-content a:hover {
      color: var(--text-secondary);
    }
    .about-content .text-muted {
      color: var(--text-secondary);
    }
    .about-content .text-highlight-teal {
      color: #14b8a6;
    }
    .about-content .text-highlight-orange {
      color: #f59e0b;
    }
    .about-content .text-highlight-purple {
      color: #8b5cf6;
    }
    .about-image {
      position: relative;
      overflow: hidden;
      border-radius: 0 15px 15px 0;
      min-height: 100%;
      align-self: stretch;
    }
    .about-image img {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .about-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 180px;
      background: linear-gradient(to right, var(--bg-secondary) 0%, var(--bg-secondary) 10%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .about-card {
        grid-template-columns: 1fr;
      }
      .about-image {
        order: -1;
        height: 250px;
        border-radius: 15px 15px 0 0;
      }
      .about-image::before {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 60px;
        background: linear-gradient(to top, var(--bg-secondary) 0%, transparent 100%);
      }
      .about-content {
        padding: 1.5rem;
      }
    }

    @media (max-width: 600px) {
      .project-thumb {
        height: 320px;
      }
    }


    @media (max-width: 1200px) {
      .content-container {
        padding: 0 1rem;
      }
    }

    /* City popover styles */
    .city-wrapper {
      position: relative;
      display: inline-block;
    }
    .city {
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .city:hover {
      color: var(--text-primary);
    }
    .city.struck {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .intro-text, .intro.locations, .city-wrapper {
      overflow: visible;
    }
    .city-wrapper {
      position: relative;
      display: inline-block;
    }
    .city-popover {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .city-wrapper:hover .city-popover {
      opacity: 1;
      visibility: visible;
    }

    /* Intro links (Resume, LinkedIn) */
    .intro-links {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .intro-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 1rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .intro-link:hover {
      color: var(--text-primary);
    }
    .intro-link svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }
    .intro-link:hover svg {
      transform: translate(2px, -2px);
    }
  </style>
</head>
<body>
  <!-- Custom cursor for case studies -->
  <div class="cursor-follower" id="cursorFollower">
    <div class="cursor-follower-inner">
      <span>View case study</span>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M12 5l7 7-7 7"/><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
  </div>

  <!-- Custom cursor for resume -->
  <div class="cursor-follower" id="resumeCursorFollower">
    <div class="cursor-follower-inner">
      <span>View resume</span>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
  </div>

  <div class="content-container">
    <header class="intro-section">
      <div class="grid-pattern" id="gridPattern"></div>
      <div class="intro-text">
        <div class="greeting-row">
          <img src="images/index/borges-headshot.jpeg" alt="Peter Borges" class="headshot" />
          <p class="greeting">Hi, I'm Peter <span class="wave-emoji">👋</span></p>
        </div>
        <h1 class="site-title">Product designer turning complex systems into interfaces people love.</h1>
        <p class="intro">Ten years making robots, banks, and governments feel human.</p>
        <p class="intro locations">Based in <span class="city-wrapper"><span class="city struck">Providence</span><img src="images/index/providence.png" alt="Providence" class="city-popover" /></span>, <span class="city-wrapper"><span class="city struck">San Francisco</span><img src="images/index/san-francisco.png" alt="San Francisco" class="city-popover" /></span>, <span class="city-wrapper"><span class="city">Brooklyn</span><img src="images/index/brooklyn.png" alt="Brooklyn" class="city-popover" /></span>.</p>
        <div class="intro-links">
          <a href="https://drive.google.com/file/d/1JjAlBwxkYLUfPeR6OmHYoYwNVmCS7Ir5/view?usp=sharing" target="_blank" class="intro-link">Resume <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></a>
          <a href="https://www.linkedin.com/in/peterborges/" target="_blank" class="intro-link">LinkedIn <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></a>
        </div>
      </div>
    </header>

    <section id="work">
      <h2 class="section-label">Selected Work</h2>
      <div class="projects" id="projectContainer"></div>
    </section>
  </div>

  <!-- Dynamic Footer -->
  <div id="site-footer"></div>

  <script>
    // Custom cursor follower
    (function() {
      const cursor = document.getElementById('cursorFollower');
      const resumeCursor = document.getElementById('resumeCursorFollower');
      let mouseX = 0, mouseY = 0;
      let cursorX = 0, cursorY = 0;

      // Smooth cursor movement
      function animateCursor() {
        const ease = 0.15;
        cursorX += (mouseX - cursorX) * ease;
        cursorY += (mouseY - cursorY) * ease;
        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';
        resumeCursor.style.left = cursorX + 'px';
        resumeCursor.style.top = cursorY + 'px';
        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      // Track mouse position
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      // Show/hide on project cards (using event delegation)
      document.addEventListener('mouseover', (e) => {
        const card = e.target.closest('.project-card:not(.resume-card)');
        const resumeCard = e.target.closest('.resume-card');
        if (card) {
          cursor.classList.add('active');
        }
        if (resumeCard) {
          resumeCursor.classList.add('active');
        }
      });

      document.addEventListener('mouseout', (e) => {
        const card = e.target.closest('.project-card:not(.resume-card)');
        const resumeCard = e.target.closest('.resume-card');
        if (card && !card.contains(e.relatedTarget)) {
          cursor.classList.remove('active');
        }
        if (resumeCard && !resumeCard.contains(e.relatedTarget)) {
          resumeCursor.classList.remove('active');
        }
      });

      // Hide cursors when leaving window
      document.addEventListener('mouseleave', () => {
        cursor.classList.remove('active');
        resumeCursor.classList.remove('active');
      });
    })();

    // Inline project data (no extra network request)
    (function() {
      const projects = [
        {
          title: "GovWell Plan Review",
          tags: "UX · UI · Prototyping · Claude Code · Launch",
          description: "Modernizing plan review permitting for local governments.",
          impact: "<strong>$9.5M</strong> seed funding · Launched to <strong>80+</strong> municipalities",
          image: "images/index/govwell-hero.png",
          link: "govwell-plan-review.html"
        },
        {
          title: "VIAM Machine Configuration",
          tags: "Strategy · Research · UX · UI · IA · Prototyping · Launch",
          description: "AI/automation tooling for configuring smart machines.",
          impact: "<strong>$117M</strong> raised · <strong>2,750+</strong> devs · <strong>40+</strong> partnerships",
          image: "images/index/app-viam-mockup-alt.png",
          link: "viam-machine-configuration.html"
        },
        {
          title: "VIAM TeleOp",
          tags: "UX · Dashboard · Sensor Data",
          description: "Live sensor dashboard for remote machine operation.",
          impact: "<strong>$2.75M</strong> signed contracts · <strong>6</strong> business partnerships",
          image: "images/index/teleop-hero-4.png",
          link: "viam-teleop.html"
        }
      ];

      const container = document.getElementById('projectContainer');

      projects.forEach(function(project) {
        const card = document.createElement('a');
        card.href = project.link;
        card.className = 'project-card';
        card.innerHTML = '<div class="project-info"><h3>' + project.title + '</h3><div class="tags">' + project.tags + '</div><p>' + project.description + '</p><p class="project-impact">' + project.impact + '</p></div><div class="project-thumb-wrapper"><img class="project-thumb" src="' + project.image + '" alt="' + project.title + ' Thumbnail" /></div>';
        container.appendChild(card);
      });

      // About Me card
      const aboutCard = document.createElement('div');
      aboutCard.className = 'about-card';
      aboutCard.innerHTML = '<div class="about-content"><h3>About me</h3><p>I\'ve spent the last decade obsessing over the details that make complex systems actually usable. Currently at <strong>GovWell</strong>, turning bureaucratic nightmares into interfaces people don\'t dread.</p><p>When I\'m not in Figma, I\'m probably <a href="https://www.kissenacycling.com/" target="_blank">racing bikes</a> through Brooklyn.</p></div><div class="about-image"><img src="images/about/RevUnit-CoWorking.jpg" alt="Peter Borges at work" /></div>';
      container.appendChild(aboutCard);

      // Resume card
      const resumeCard = document.createElement('a');
      resumeCard.href = 'https://drive.google.com/file/d/1JjAlBwxkYLUfPeR6OmHYoYwNVmCS7Ir5/view?usp=sharing';
      resumeCard.target = '_blank';
      resumeCard.className = 'project-card resume-card';
      resumeCard.innerHTML = '<div class="project-info"><h3>Resume</h3><div class="tags">Experience · Skills · Education</div><p>10+ years designing for robotics, fintech, and government.</p></div>';
      container.appendChild(resumeCard);
    })();

    // Generate grid pattern
    (function() {
      const gridContainer = document.getElementById('gridPattern');
      if (!gridContainer) return;

      const header = document.querySelector('.intro-section');
      const cols = Math.ceil((header.offsetWidth * 1.1) / 56) + 2;
      const rows = Math.ceil((header.offsetHeight + 112) / 56) + 2;

      const squares = [];
      for (let i = 0; i < cols * rows; i++) {
        const square = document.createElement('div');
        square.className = 'grid-square';
        square.innerHTML = `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="48" height="48" rx="12" fill="none" stroke-width="1"/></svg>`;
        gridContainer.appendChild(square);
        squares.push(square);
      }

      // Random pulse animation
      function pulseRandomSquare() {
        const randomIndex = Math.floor(Math.random() * squares.length);
        const square = squares[randomIndex];
        if (!square.classList.contains('pulse')) {
          square.classList.add('pulse');
          setTimeout(() => square.classList.remove('pulse'), 2500);
        }
      }

      // Start random pulses
      setInterval(pulseRandomSquare, 400);
      // Initial pulses
      for (let i = 0; i < 3; i++) {
        setTimeout(pulseRandomSquare, i * 300);
      }
    })();


    // Load footer from partial
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }

    // Initialize theme from saved preference or system preference
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme) {
        if (theme === 'system' || !theme) {
          // Follow system preference
          document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }

      // Apply initial theme
      applyTheme(savedTheme || 'system');

      // Listen for system theme changes
      prefersDark.addEventListener('change', (e) => {
        const currentSetting = localStorage.getItem('theme');
        if (!currentSetting || currentSetting === 'system') {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();

    includeHTML('#site-footer', 'partials/footer.html', function() {
      // Setup theme switcher
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher) {
        const buttons = themeSwitcher.querySelectorAll('.theme-option');
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        buttons.forEach(btn => {
          if (btn.dataset.theme === savedTheme) btn.classList.add('active');
        });

        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (theme === 'system') {
              document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
              localStorage.setItem('theme', 'system');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
              localStorage.setItem('theme', theme);
            }
          });
        });
      }
    });

  </script>
</body>
</html>

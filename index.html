<!-- index.html (Home Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peter Borges | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    footer {
      margin-top: auto;
    }
    .content-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .project-card {
      display: block;
      position: relative;
      width: 100%;
      text-decoration: none;
      color: inherit;
      padding: 1.5rem 0;
      overflow: visible;
    }
    .project-card h3 {
      display: inline;
    }
    .project-card:hover h3 {
      text-decoration: underline;
    }
    .project-info p {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      margin: 0.5rem 0 0;
      color: var(--text-secondary);
    }
    .project-card:hover .project-info p {
      opacity: 1;
      visibility: visible;
    }
    .project-info {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: left;
      max-width: 60%;
    }
    .project-thumb {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 400px;
      height: 280px;
      object-fit: cover;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }
    .project-card:hover .project-thumb {
      opacity: 1 !important;
    }
    @media (max-width: 1200px) {
      .content-container {
        padding: 0 1rem;
      }
    }
    @media (max-width: 800px) {
      .project-thumb {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Dynamic Header -->
  <div id="site-header"></div>

  <div class="content-container">
    <header class="intro-section">
      <div class="intro-content">
        <div class="headshot-container">
          <img src="images/index/borges-headshot.jpeg" alt="Peter Borges" class="headshot-color" />
          <img src="images/index/borges-headshot-dithered.png" alt="" class="headshot-dithered" aria-hidden="true" />
          <div class="headshot-spotlight"></div>
        </div>
        <div class="intro-text">
          <p class="intro">I turn complex systems into interfaces people actually enjoy using. Ten years of making robots, banks, and governments feel human.</p>
          <div class="locations">Based in <s>Providence,</s> <s>San Francisco,</s> Brooklyn.</div>
        </div>
      </div>
    </header>

    <section id="work">
      <div class="projects" id="projectContainer"></div>
    </section>
  </div>

  <!-- Dynamic Footer -->
  <div id="site-footer"></div>

  <script>
    // Load projects from JSON
    fetch('projects.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('projectContainer');
        data.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = project.link;
          card.className = 'project-card';

          card.innerHTML = `
  <div class="project-info">
    <h3>${project.title}</h3>
    <div class="tags">${project.tags}</div>
    <p>${project.description}</p>
    <p class="project-impact">${project.impact.replace(/(\$?\d[\d,.]*\+?%?m?)/gi, '<strong>$1</strong>')}</p>
  </div>
  <img class="project-thumb" src="${project.image}" alt="${project.title} Thumbnail" />
`;

          container.appendChild(card);
        });
      });

    // Load header and footer from partials
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }
    
    // Initialize theme from saved preference or system preference
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (prefersDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    
    includeHTML('#site-header', 'partials/header.html', function() {
      // Setup theme toggle after header loads
      const toggle = document.querySelector('.theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
        });
      }
    });
    includeHTML('#site-footer', 'partials/footer.html');

    // Headshot spotlight effect
    const headshotContainer = document.querySelector('.headshot-container');
    if (headshotContainer) {
      headshotContainer.addEventListener('mousemove', (e) => {
        const rect = headshotContainer.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        headshotContainer.style.setProperty('--mouse-x', `${x}%`);
        headshotContainer.style.setProperty('--mouse-y', `${y}%`);
      });
      
      headshotContainer.addEventListener('mouseleave', () => {
        headshotContainer.style.setProperty('--mouse-x', '50%');
        headshotContainer.style.setProperty('--mouse-y', '50%');
      });
    }
  </script>
</body>
</html>

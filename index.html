<!-- index.html (Home Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peter Borges | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    footer {
      margin-top: auto;
    }
    .content-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .site-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.75rem 0;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .intro-section {
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 3rem 0 1.5rem calc(100px + 2rem);
    }
    @media (max-width: 600px) {
      .section-label { margin-left: 0; }
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      margin-left: calc(100px + 2rem);
    }
    @media (max-width: 600px) {
      .projects {
        margin-left: 0;
      }
    }
    .project-card {
      display: block;
      position: static;
      width: 100%;
      text-decoration: none;
      color: inherit;
      padding: 1.5rem 0;
      overflow: visible;
    }
    .project-card h3 {
      display: inline;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .project-card:hover h3 {
      text-decoration: underline;
    }
    .project-card .tags {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .project-info p {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      margin: 0.5rem 0 0;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    .project-card:hover .project-info p {
      opacity: 1;
      visibility: visible;
    }
    .project-impact {
      font-size: 0.85rem;
    }
    .project-impact strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .project-info {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: left;
      max-width: 60%;
    }
    .project-thumb {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 400px;
      height: 280px;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }
    .project-card:hover .project-thumb {
      opacity: 1 !important;
    }
    
    /* Resume card specific styles */
    .resume-card .project-thumb {
      object-fit: contain;
      background: var(--bg-secondary);
      object-position: center top;
    }
    
    @media (max-width: 1200px) {
      .content-container {
        padding: 0 1rem;
      }
    }
    @media (max-width: 800px) {
      .project-thumb {
        display: none;
      }
    }
    
    /* City popover styles */
    .city-wrapper {
      position: relative;
      display: inline-block;
    }
    .city {
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .city:hover {
      color: var(--text-primary);
    }
    .city-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    .city-wrapper:hover .city-popover {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <div class="content-container">
    <header class="intro-section">
      <div class="intro-content">
        <div class="headshot-container">
          <img src="images/index/borges-headshot.jpeg" alt="Peter Borges" class="headshot-color" />
          <img src="images/index/borges-headshot-dithered.png" alt="" class="headshot-dithered" aria-hidden="true" />
          <div class="headshot-spotlight"></div>
        </div>
        <div class="intro-text">
          <h1 class="site-title">Peter Borges</h1>
          <p class="role-label">Product Designer</p>
          <p class="intro">I turn complex systems into interfaces people actually enjoy using. Ten years of making robots, banks, and governments feel human.</p>
          <div class="locations">Based in 
            <span class="city-wrapper"><s class="city" data-city="providence">Providence,</s><img src="images/index/providence.png" alt="Providence" class="city-popover" /></span>
            <span class="city-wrapper"><s class="city" data-city="sf">San Francisco,</s><img src="https://images.unsplash.com/photo-1521464302861-ce943915d1c3?w=300&h=200&fit=crop" alt="San Francisco Painted Ladies" class="city-popover" /></span>
            <span class="city-wrapper"><span class="city" data-city="brooklyn">Brooklyn.</span><img src="images/index/brooklyn.png" alt="Brooklyn brownstones" class="city-popover" /></span>
          </div>
        </div>
      </div>
    </header>

    <section id="work">
      <h2 class="section-label">Selected Work</h2>
      <div class="projects" id="projectContainer"></div>
    </section>
  </div>

  <!-- Dynamic Footer -->
  <div id="site-footer"></div>

  <script>
    // Load projects from JSON
    fetch('projects.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('projectContainer');
        
        // Add case study cards
        data.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = project.link;
          card.className = 'project-card';

          card.innerHTML = `
  <div class="project-info">
    <h3>${project.title}</h3>
    <div class="tags">${project.tags}</div>
    <p>${project.description}</p>
    <p class="project-impact">${project.impact.replace(/(\$?\d[\d,.]*\+?%?m?)/gi, '<strong>$1</strong>')}</p>
  </div>
  <img class="project-thumb" src="${project.image}" alt="${project.title} Thumbnail" />
`;

          container.appendChild(card);
        });
        
        // Add Resume card at the end
        const resumeCard = document.createElement('a');
        resumeCard.href = 'resume.html';
        resumeCard.className = 'project-card resume-card';
        resumeCard.innerHTML = `
  <div class="project-info">
    <h3>Resume</h3>
    <div class="tags">Experience · Skills · Education</div>
    <p>10+ years designing for robotics, fintech, and government.</p>
  </div>
  <img class="project-thumb" src="images/index/resume-preview.svg" alt="Resume Preview" />
`;
        container.appendChild(resumeCard);
      });

    // Load footer from partial
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }
    
    // Initialize theme from saved preference or system preference
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      
      function applyTheme(theme) {
        if (theme === 'system' || !theme) {
          // Follow system preference
          document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }
      
      // Apply initial theme
      applyTheme(savedTheme || 'system');
      
      // Listen for system theme changes
      prefersDark.addEventListener('change', (e) => {
        const currentSetting = localStorage.getItem('theme');
        if (!currentSetting || currentSetting === 'system') {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();
    
    includeHTML('#site-footer', 'partials/footer.html', function() {
      // Fetch visitor location after footer loads
      fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
          const locationEl = document.getElementById('visitor-location');
          if (locationEl) {
            if (data.city && data.region) {
              locationEl.textContent = `${data.city}, ${data.region}`;
            } else if (data.city && data.country_name) {
              locationEl.textContent = `${data.city}, ${data.country_name}`;
            } else if (data.country_name) {
              locationEl.textContent = data.country_name;
            } else {
              locationEl.textContent = 'somewhere on Earth';
            }
          }
        })
        .catch(() => {
          const locationEl = document.getElementById('visitor-location');
          if (locationEl) locationEl.textContent = 'parts unknown';
        });
        
      // Email copy functionality
      const copyBtn = document.getElementById('copyBtn');
      const tooltip = document.getElementById('emailTooltip');
      const email = 'pborges@alumni.risd.edu';
      
      if (copyBtn) {
        copyBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          navigator.clipboard.writeText(email).then(() => {
            tooltip.classList.add('copied');
            setTimeout(() => tooltip.classList.remove('copied'), 2000);
          }).catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = email;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            tooltip.classList.add('copied');
            setTimeout(() => tooltip.classList.remove('copied'), 2000);
          });
        });
      }
      
      // Setup theme switcher
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher) {
        const buttons = themeSwitcher.querySelectorAll('.theme-option');
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        
        // Set initial active state
        buttons.forEach(btn => {
          if (btn.dataset.theme === savedTheme) {
            btn.classList.add('active');
          }
        });
        
        // Handle clicks
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;
            
            // Update active state
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Apply theme
            if (theme === 'system') {
              document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
              localStorage.setItem('theme', 'system');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
              localStorage.setItem('theme', theme);
            }
          });
        });
      }
    });

    // Headshot spotlight effect
    const headshotContainer = document.querySelector('.headshot-container');
    if (headshotContainer) {
      headshotContainer.addEventListener('mousemove', (e) => {
        const rect = headshotContainer.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        headshotContainer.style.setProperty('--mouse-x', `${x}%`);
        headshotContainer.style.setProperty('--mouse-y', `${y}%`);
      });
      
      headshotContainer.addEventListener('mouseleave', () => {
        headshotContainer.style.setProperty('--mouse-x', '50%');
        headshotContainer.style.setProperty('--mouse-y', '50%');
      });
    }
  </script>
</body>
</html>

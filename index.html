<!-- index.html (Home Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peter Borges | Home</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* Loading Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .headshot {
      animation: fadeIn 0.5s ease-out 0.1s both;
    }
    .greeting {
      animation: fadeIn 0.5s ease-out 0.2s both;
    }

    .site-title {
      animation: fadeInUp 0.6s ease-out 0.3s both;
    }

    .intro-text .intro {
      animation: fadeInUp 0.5s ease-out 0.5s both;
    }

    .section-label {
      animation: fadeIn 0.5s ease-out 0.5s both;
    }

    .project-card {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out both;
    }

    .project-card:nth-child(1) { animation-delay: 0.6s; }
    .project-card:nth-child(2) { animation-delay: 0.7s; }
    .project-card:nth-child(3) { animation-delay: 0.8s; }
    .project-card:nth-child(4) { animation-delay: 0.9s; }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .greeting,
      .site-title,
      .intro-text .intro,
      .section-label,
      .project-card {
        animation: none;
        opacity: 1;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    footer {
      margin-top: auto;
    }
    .content-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .greeting-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0 0.75rem 0;
    }
    .headshot {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
    }
    .greeting {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 400;
    }
    .site-title {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 700;
      margin: 0 0 1.25rem 0;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text-primary);
    }
    .intro {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0;
      max-width: 600px;
    }
    .intro-section {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 3rem 0 1.5rem 0;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .project-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--bg-primary);
      border: none;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    .project-card h3 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 0.35rem 0;
    }
    .project-card:hover h3 {
      text-decoration: underline;
    }
    .project-card .tags {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .project-info {
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.5rem;
    }
    .project-info p {
      margin: 0.5rem 0 0;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }
    .project-impact {
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }
    .project-impact strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .project-thumb-wrapper {
      padding: 0 3rem 0 3rem;
      overflow: visible;
    }
    .project-thumb {
      width: 100%;
      height: 520px;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      transition: transform 0.4s ease;
      transform: translateY(30px);
    }
    .project-card:hover .project-thumb {
      transform: translateY(10px);
    }


    @media (max-width: 600px) {
      .project-thumb {
        height: 320px;
      }
    }


    @media (max-width: 1200px) {
      .content-container {
        padding: 0 1rem;
      }
    }

    /* City popover styles */
    .city-wrapper {
      position: relative;
      display: inline-block;
    }
    .city {
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .city:hover {
      color: var(--text-primary);
    }
    .city-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    .city-wrapper:hover .city-popover {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <div class="content-container">
    <header class="intro-section">
      <div class="intro-text">
        <div class="greeting-row">
          <img src="images/index/borges-headshot.jpeg" alt="Peter Borges" class="headshot" />
          <p class="greeting">Hi, I'm Peter 👋</p>
        </div>
        <h1 class="site-title">Product designer turning complex systems into interfaces people love.</h1>
        <p class="intro">Ten years making robots, banks, and governments feel human. Currently designing at GovWell.</p>
      </div>
    </header>

    <section id="work">
      <h2 class="section-label">Selected Work</h2>
      <div class="projects" id="projectContainer"></div>
    </section>
  </div>

  <!-- Dynamic Footer -->
  <div id="site-footer"></div>

  <script>
    // Load projects from JSON
    fetch('projects.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('projectContainer');

        // Add case study cards
        data.forEach((project, index) => {
          const card = document.createElement('a');
          card.href = project.link;
          card.className = 'project-card';

          card.innerHTML = `
  <div class="project-info">
    <h3>${project.title}</h3>
    <div class="tags">${project.tags}</div>
    <p>${project.description}</p>
    <p class="project-impact">${project.impact.replace(/(\$?\d[\d,.]*\+?%?m?)/gi, '<strong>$1</strong>')}</p>
  </div>
  <div class="project-thumb-wrapper"><img class="project-thumb" src="${project.image}" alt="${project.title} Thumbnail" /></div>
`;

          container.appendChild(card);
        });

        // Add Resume card at the end
        const resumeCard = document.createElement('a');
        resumeCard.href = 'https://drive.google.com/file/d/15g_KavnYfn1syP9O4ltiDJ5Yh6jWyVY5/view?usp=sharing';
        resumeCard.target = '_blank';
        resumeCard.className = 'project-card resume-card';
        resumeCard.innerHTML = `
  <div class="project-info">
    <h3>Resume</h3>
    <div class="tags">Experience · Skills · Education</div>
    <p>10+ years designing for robotics, fintech, and government.</p>
  </div>
`;
        container.appendChild(resumeCard);
      });

    // Load footer from partial
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }

    // Initialize theme from saved preference or system preference
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme) {
        if (theme === 'system' || !theme) {
          // Follow system preference
          document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }

      // Apply initial theme
      applyTheme(savedTheme || 'system');

      // Listen for system theme changes
      prefersDark.addEventListener('change', (e) => {
        const currentSetting = localStorage.getItem('theme');
        if (!currentSetting || currentSetting === 'system') {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();

    includeHTML('#site-footer', 'partials/footer.html', function() {
      // Fetch visitor location after footer loads
      fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
          const locationEl = document.getElementById('visitor-location');
          if (locationEl) {
            if (data.city && data.region) {
              locationEl.textContent = `${data.city}, ${data.region}`;
            } else if (data.city && data.country_name) {
              locationEl.textContent = `${data.city}, ${data.country_name}`;
            } else if (data.country_name) {
              locationEl.textContent = data.country_name;
            } else {
              locationEl.textContent = 'somewhere on Earth';
            }
          }
        })
        .catch(() => {
          const locationEl = document.getElementById('visitor-location');
          if (locationEl) locationEl.textContent = 'parts unknown';
        });

      // Email copy functionality
      const copyBtn = document.getElementById('copyBtn');
      const tooltip = document.getElementById('emailTooltip');
      const email = 'pborges@alumni.risd.edu';

      if (copyBtn) {
        copyBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();

          navigator.clipboard.writeText(email).then(() => {
            tooltip.classList.add('copied');
            setTimeout(() => tooltip.classList.remove('copied'), 2000);
          }).catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = email;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            tooltip.classList.add('copied');
            setTimeout(() => tooltip.classList.remove('copied'), 2000);
          });
        });
      }

      // Setup theme switcher
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher) {
        const buttons = themeSwitcher.querySelectorAll('.theme-option');
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        // Set initial active state
        buttons.forEach(btn => {
          if (btn.dataset.theme === savedTheme) {
            btn.classList.add('active');
          }
        });

        // Handle clicks
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            const theme = btn.dataset.theme;

            // Update active state
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Apply theme
            if (theme === 'system') {
              document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
              localStorage.setItem('theme', 'system');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
              localStorage.setItem('theme', theme);
            }
          });
        });
      }
    });

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SFY6LBQ0SF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SFY6LBQ0SF');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viam TeleOp | Peter Borges</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="side-rail.js" defer></script>
  <script src="case-study-template.js" defer></script>
  <!-- Early theme application to prevent flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme(theme) {
        if (theme === 'system' || !theme) {
          document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      }
      applyTheme(savedTheme || 'system');
      prefersDark.addEventListener('change', function(e) {
        const currentSetting = localStorage.getItem('theme');
        if (!currentSetting || currentSetting === 'system') {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      });
    })();
  </script>
  <style>
    .next-case-study {
      background: var(--bg-secondary);
      padding: 4rem 2rem;
      margin-top: 2rem;
    }
    .next-case-study-inner {
      max-width: 1000px;
      margin: 0 auto;
    }
    .next-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 1rem;
    }
    .next-case-study-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      padding: 1.5rem 0;
      gap: 2rem;
    }
    .next-case-study-card:hover h3 {
      text-decoration: underline;
    }
    .next-case-study-info h3 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      color: var(--text-primary);
    }
    .next-case-study-info p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 1rem;
    }
    .next-case-study-image {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    @media (max-width: 700px) {
      .next-case-study-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .next-case-study-image {
        width: 100%;
        height: auto;
      }
    }
    .insight-section {
      margin: 2rem 0;
    }
    .insight-image-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }
    .image-wrapper img {
      width: 100%;
      border-radius: 8px;
    }
    .image-caption {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
    @media (max-width: 600px) {
      .insight-image-row {
        grid-template-columns: 1fr;
      }
    }
    .design-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 2rem 0;
      padding: 2rem;
      background: var(--bg-secondary);
      border-radius: 12px;
    }
    .flow-step {
      text-align: center;
      padding: 1rem;
    }
    .flow-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .flow-step p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .flow-arrow {
      font-size: 1.5rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div class="content-container" style="padding-top: 4rem;">
    <div id="case-study-content">
      <div class="loading-state">Loading...</div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script>
    function includeHTML(selector, url, callback) {
      fetch(url)
        .then(response => response.text())
        .then(data => {
          document.querySelector(selector).innerHTML = data;
          if (callback) callback();
        });
    }
    
    includeHTML('#site-header', 'partials/header.html');
    includeHTML('#site-footer', 'partials/footer.html', function() {
      const themeSwitcher = document.querySelector('.theme-switcher');
      if (themeSwitcher) {
        const buttons = themeSwitcher.querySelectorAll('.theme-option');
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        buttons.forEach(btn => {
          if (btn.dataset.theme === savedTheme) btn.classList.add('active');
        });
        buttons.forEach(btn => {
          btn.addEventListener('click', function() {
            buttons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const theme = this.dataset.theme;
            if (theme === 'system') {
              document.documentElement.setAttribute('data-theme', prefersDark.matches ? 'dark' : 'light');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('theme', theme);
          });
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const renderer = new CaseStudyRenderer('case-study-content', 'case-studies/viam-teleop.json');
      renderer.render();
    });
  </script>
</body>
</html>
